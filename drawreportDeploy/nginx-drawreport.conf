# /etc/nginx/sites-available/drawreport.com  (symlinked into sites-enabled/)
# DrawReport vhost - own server block, does NOT touch cosmyday-api's vhost.
#
# THIS FILE IS THE BOOTSTRAP, PRE-TLS STATE ONLY. It has to serve the app over
# plain HTTP on both names, because certbot's HTTP-01 challenge needs port 80
# to answer and there is no certificate yet to redirect to.
#
# After this is in place + DNS resolves:
#   certbot --nginx -d drawreport.com -d www.drawreport.com
# and then REPLACE this file with nginx-drawreport-tls.conf, which is the
# real live config: one canonical host, www redirected rather than served.
# Leaving the bootstrap in place after certbot is what produced the
# "Duplicate without user-selected canonical" report on the www root.
server {
    listen 80;
    listen [::]:80;
    server_name drawreport.com www.drawreport.com;

    client_max_body_size 50M;     # uploads: up to 3 drawings x 15 MB

    location /static/ {
        alias /var/www/DrawReport/static/;
        expires 30d;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
