# /etc/nginx/sites-available/drawreport.com  (symlinked into sites-enabled/)
# DrawReport vhost - own server block, does NOT touch cosmyday-api's vhost.
#
# ONE canonical host: drawreport.com. www is a redirect, never a copy.
# Until V0.052 a single server block answered BOTH names, so
# https://www.drawreport.com/... served a full 200 copy of every page. The
# pages self-canonicalised via their <link rel=canonical>, but the www ROOT
# could not - it answers with a redirect, and a redirect carries no canonical
# tag - so Search Console filed it as "Duplicate without user-selected
# canonical". Hence the dedicated www server block below.

# Log format for the Growth API: $uri, NOT $request. $request carries the query string,
# and the Growth API accepts the token as a query parameter for clients that cannot send a
# header - so the default format would write a live credential to disk on every call.
log_format growth_nolog '$remote_addr - [$time_local] "$request_method $uri" '
                        '$status $body_bytes_sent $request_time';

# --- canonical host -----------------------------------------------------
server {
    server_name drawreport.com;

    client_max_body_size 50M;     # uploads: up to 3 drawings x 15 MB

    location /static/ {
        alias /var/www/DrawReport/static/;
        expires 30d;
        access_log off;
    }

    # Growth API. Identical proxying to "/" below - the ONLY reason this block exists is
    # the log format.
    #
    # The API accepts ?token=<GROWTH_AGENT_TOKEN> as a fallback for clients that cannot
    # set an Authorization header (ChatGPT's web fetcher is the one that forced it). The
    # default combined format logs $request, which is "GET /internal/growth/summary?...
    # &token=SECRET HTTP/1.1" - so every call would write a live credential into
    # access.log, where it then survives into every log rotation and backup.
    #
    # growth_nolog logs $uri instead, which is the path with the query string already
    # stripped. We keep the timing and status of each call and lose only the arguments.
    location /internal/ {
        access_log /var/log/nginx/drawreport-growth.log growth_nolog;
        proxy_pass http://127.0.0.1:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://127.0.0.1:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/drawreport.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/drawreport.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# --- www -> non-www, over TLS -------------------------------------------
# The cert already covers both names (certbot ran with -d drawreport.com
# -d www.drawreport.com), so this block reuses it. It must terminate TLS:
# a browser validates the certificate BEFORE it sees the redirect.
server {
    server_name www.drawreport.com;

    listen [::]:443 ssl;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/drawreport.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/drawreport.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    return 301 https://drawreport.com$request_uri;
}

# --- plain HTTP: straight to the canonical https host, one hop ----------
server {
    listen 80;
    listen [::]:80;
    server_name drawreport.com www.drawreport.com;

    # Note the literal host rather than $host: sending http://www to
    # https://www would cost a second redirect for no reason.
    return 301 https://drawreport.com$request_uri;
}
