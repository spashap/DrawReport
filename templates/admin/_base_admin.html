<!DOCTYPE html>
{# Admin shell: left sidebar of sections + work area. No site header.
   Styling comes ONLY from the design system (tokens.css + components.css, the
   .admin-* block). This template used to carry its own <style> block with hardcoded
   colours and sizes, which silently overrode the design system - that is exactly what
   the project rule forbids. #}
<html lang="en" class="{{ palette | default('') }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>{% block title %}Admin{% endblock %} — DrawReport</title>
<link rel="icon" type="image/png" href="{{ static }}/img/favico/favicon-96x96.png" sizes="96x96">
{# ?v= as on the site: nginx serves static with max-age=30 days, and without a version
   admin CSS changes never reach anyone who has already been in the admin. #}
<link rel="stylesheet" href="{{ static }}/css/fonts.css?v={{ version }}">
<link rel="stylesheet" href="{{ static }}/css/tokens.css?v={{ version }}">
<link rel="stylesheet" href="{{ static }}/css/components.css?v={{ version }}">
</head>
<body class="admin-body">
<div class="admin-layout">
  <aside class="admin-side">
    <a class="logo admin-side__logo" href="/">Draw<b>Report</b></a>
    <nav class="admin-side__nav">
      {% for endpoint, label in sections %}
      <a href="{{ url_for(endpoint) }}" class="{% if endpoint == active %}is-active{% endif %}">{{ label }}</a>
      {% endfor %}
    </nav>
    <form method="post" action="{{ url_for('admin.logout') }}" class="admin-side__logout">
      <button type="submit">Log out</button>
    </form>
  </aside>
  <main class="admin-main prose">
    {% block content %}{% endblock %}
  </main>
</div>
</body>
</html>
